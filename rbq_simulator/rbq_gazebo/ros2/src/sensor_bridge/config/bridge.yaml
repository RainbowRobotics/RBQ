# sim clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# world -> base_link
- ros_topic_name: "/tf"
  gz_topic_name: "/rbq/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# joint_states
- ros_topic_name: "/joint_states"
  gz_topic_name: "/rbq/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# IMU (500 Hz)
- ros_topic_name: "/rbq/imu/IMU_state"
  gz_topic_name: "/rbq/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# LiDAR: Livox MID-360 x2
- ros_topic_name: "/rbq/lidar/lidar_front/points"
  gz_topic_name: "/rbq/lidar/lidar_front/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
- ros_topic_name: "/rbq/lidar/lidar_rear/points"
  gz_topic_name: "/rbq/lidar/lidar_rear/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# LiDAR: Ouster OS x1
- ros_topic_name: "/rbq/lidar/lidar_ouster/points"
  gz_topic_name: "/rbq/lidar/lidar_ouster/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
