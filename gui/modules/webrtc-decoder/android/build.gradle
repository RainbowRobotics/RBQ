plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.webrtcdecoder'
version = '0.1.0'

android {
  namespace "expo.modules.webrtcdecoder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':react-native-webrtc')
}
