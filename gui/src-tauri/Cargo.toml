[package]
name = "app"
version = "0.1.0"
description = "RBQ Controller desktop shell"
authors = ["Rainbow Robotics"]
license = "Apache-2.0"
repository = "https://github.com/RainbowRobotics/RBQ"
edition = "2021"
rust-version = "1.77.2"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
